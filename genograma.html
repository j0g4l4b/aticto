<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genograma - Árbol Genealógico Interactivo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--text-secondary:#64748b;
  --primary:#3b82f6;--primary-hover:#2563eb;--danger:#ef4444;--success:#22c55e;
  --male:#dbeafe;--male-border:#3b82f6;--female:#fce7f3;--female-border:#ec4899;
  --other:#fef3c7;--other-border:#f59e0b;--deceased:#d1d5db;
  --sidebar-w:320px;--toolbar-h:56px;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

/* Toolbar */
.toolbar{height:var(--toolbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;z-index:10;position:relative}
.toolbar h1{font-size:18px;font-weight:700;margin-right:16px;white-space:nowrap}
.toolbar h1 span{color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{background:#f1f5f9;border-color:#cbd5e1}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:#fef2f2}
.btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn svg{width:16px;height:16px;fill:currentColor}
.toolbar-sep{width:1px;height:28px;background:var(--border);margin:0 4px}
.toolbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* Layout */
.app{display:flex;height:calc(100vh - var(--toolbar-h))}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;z-index:5}
.sidebar.collapsed{width:0;min-width:0;overflow:hidden}
.sidebar-section{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-section h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.sidebar-section h3 svg{width:16px;height:16px;fill:var(--primary)}

.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;color:var(--text);background:var(--bg);transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.form-group textarea{resize:vertical;min-height:40px}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}

.person-list{list-style:none}
.person-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .15s;font-size:13px}
.person-item:hover{background:#f1f5f9}
.person-item.selected{background:#dbeafe}
.person-item .symbol{width:20px;height:20px;border:2px solid;border-radius:2px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px}
.person-item .symbol.male{background:var(--male);border-color:var(--male-border);border-radius:2px}
.person-item .symbol.female{background:var(--female);border-color:var(--female-border);border-radius:50%}
.person-item .symbol.other{background:var(--other);border-color:var(--other-border);transform:rotate(45deg);border-radius:2px}
.person-item .symbol.deceased{background:var(--deceased);opacity:.7}
.person-item .info{flex:1;min-width:0}
.person-item .info .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-item .info .age{font-size:11px;color:var(--text-secondary)}
.person-item .actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.person-item:hover .actions{opacity:1}
.person-item .actions button{background:none;border:none;cursor:pointer;padding:4px;border-radius:4px;color:var(--text-secondary);display:flex}
.person-item .actions button:hover{background:#e2e8f0;color:var(--text)}
.person-item .actions button svg{width:14px;height:14px;fill:currentColor}

/* Canvas */
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.canvas-wrap svg{width:100%;height:100%;cursor:grab}
.canvas-wrap svg.grabbing{cursor:grabbing}
.canvas-wrap svg .node{cursor:pointer}
.canvas-wrap svg .node:hover .node-shape{filter:brightness(.95)}
.canvas-wrap svg .node.selected .node-shape{stroke-width:3;filter:drop-shadow(0 0 6px rgba(59,130,246,.4))}
.canvas-wrap svg .node.dragging{cursor:grabbing}

/* Legend */
.legend{position:absolute;bottom:12px;left:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:11px;display:flex;gap:16px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:4;max-width:calc(100% - 24px)}
.legend-item{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend-symbol{width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.legend-symbol svg{width:18px;height:18px}

/* Zoom controls */
.zoom-controls{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:4px;z-index:4}
.zoom-controls .btn{padding:8px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:12px;padding:24px;width:90%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:translateY(20px);transition:transform .2s}
.modal-overlay.active .modal{transform:translateY(0)}
.modal h2{font-size:18px;margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:absolute;left:0;top:0;height:100%;z-index:20;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .sidebar.collapsed{width:0}
  .toolbar h1 span{display:none}
}

/* Print */
@media print{
  .toolbar,.sidebar,.legend,.zoom-controls,.toast{display:none!important}
  .app{display:block}
  .canvas-wrap{position:static;width:100%;height:auto}
  .canvas-wrap svg{width:100%;height:auto}
  @page{size:landscape;margin:1cm}
  body{background:#fff}
}
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn" onclick="toggleSidebar()" title="Panel lateral">
    <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
  </button>
  <h1>Geno<span>grama</span></h1>
  <div class="toolbar-sep"></div>

  <button class="btn" id="btnAddPerson" onclick="openPersonModal()">
    <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    Persona

  <button class="btn" id="btnAddRelation" onclick="startRelationMode()">

  <button class="btn" id="btnAddChild" onclick="startChildMode()">

  <div class="toolbar-right">
    <button class="btn" onclick="autoLayout()" title="Auto-organizar">

    <div class="toolbar-sep"></div>
    <button class="btn" onclick="saveToLocal()" title="Guardar">
      <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
    </button>
    <button class="btn" onclick="loadFromLocal()" title="Cargar">
      <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
    </button>
    <div class="toolbar-sep"></div>
    <button class="btn" onclick="exportPNG()" title="Exportar PNG">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      PNG
    </button>
    <button class="btn" onclick="exportSVG()" title="Exportar SVG">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      SVG
    </button>
    <button class="btn" onclick="printDiagram()" title="Imprimir">
      <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
    </button>
    <div class="toolbar-sep"></div>
    <button class="btn danger" onclick="clearAll()" title="Limpiar todo">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <h3>
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Personas
      </h3>
      <ul class="person-list" id="personList"></ul>
      <button class="btn primary" onclick="openPersonModal()" style="width:100%;justify-content:center;margin-top:8px">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/></svg>
        Agregar Persona
      </button>
    </div>

    <div class="sidebar-section">
      <h3>
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3z"/></svg>
        Relaciones
      </h3>
      <div id="relationList" style="font-size:13px;color:var(--text-secondary)"></div>
    </div>

    <div class="sidebar-section" id="modeIndicator" style="display:none">
      <div style="padding:12px;background:#fef3c7;border-radius:8px;font-size:13px;text-align:center">
        <strong id="modeText"></strong><br>
        <button class="btn" onclick="cancelMode()" style="margin-top:8px;font-size:12px">Cancelar</button>
      </div>
    </div>
  </aside>

  <div class="canvas-wrap" id="canvasWrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
        </marker>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)" class="grid-bg"/>
      <g id="diagram"></g>
    </svg>

    <div class="legend" id="legend">
      <div class="legend-item">
        <div class="legend-symbol"><svg viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="1"/></svg></div>
        Masculino
      </div>
      <div class="legend-item">
        <div class="legend-symbol"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/></svg></div>
        Femenino
      </div>
      <div class="legend-item">
        <div class="legend-symbol"><svg viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="1" transform="rotate(45 10 10)"/></svg></div>
        Otro
      </div>
      <div class="legend-item">
        <div class="legend-symbol"><svg viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" fill="#d1d5db" stroke="#6b7280" stroke-width="2" rx="1"/><line x1="3" y1="3" x2="17" y2="17" stroke="#6b7280" stroke-width="2"/><line x1="17" y1="3" x2="3" y2="17" stroke="#6b7280" stroke-width="2"/></svg></div>
        Fallecido
      </div>
      <div class="legend-item">
        <div class="legend-symbol"><svg viewBox="0 0 40 6"><line x1="0" y1="3" x2="40" y2="3" stroke="#64748b" stroke-width="2"/></svg></div>
        Matrimonio
      </div>
      <div class="legend-item">
        <div class="legend-symbol"><svg viewBox="0 0 40 6"><line x1="0" y1="3" x2="40" y2="3" stroke="#64748b" stroke-width="2" stroke-dasharray="6 3"/></svg></div>
        Unión libre
      </div>
      <div class="legend-item">
        <div class="legend-symbol"><svg viewBox="0 0 40 10"><line x1="0" y1="5" x2="40" y2="5" stroke="#64748b" stroke-width="2"/><line x1="17" y1="1" x2="23" y2="9" stroke="#64748b" stroke-width="2"/></svg></div>
        Separación
      </div>
      <div class="legend-item">
        <div class="legend-symbol"><svg viewBox="0 0 40 10"><line x1="0" y1="5" x2="40" y2="5" stroke="#64748b" stroke-width="2"/><line x1="15" y1="1" x2="21" y2="9" stroke="#64748b" stroke-width="2"/><line x1="19" y1="1" x2="25" y2="9" stroke="#64748b" stroke-width="2"/></svg></div>
        Divorcio
      </div>
    </div>

    <div class="zoom-controls">
      <button class="btn" onclick="zoomIn()" title="Acercar">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
      <button class="btn" onclick="zoomOut()" title="Alejar">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M19 13H5v-2h14v2z"/></svg>
      </button>
      <button class="btn" onclick="resetView()" title="Restablecer vista">

      </button>
    </div>

</div>

<!-- Person Modal -->
<div class="modal-overlay" id="personModal">
  <div class="modal">
    <h2 id="personModalTitle">Agregar Persona</h2>
    <input type="hidden" id="editPersonId">
    <div class="form-group">
      <label>Nombre completo</label>

    </div>
    <div class="form-row">
      <div class="form-group">

      </div>

        <label>Género</label>

          <option value="female">Femenino</option>

      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Estado</label>
        <select id="personAlive">
          <option value="true">Vivo/a</option>
          <option value="false">Fallecido/a</option>

      </div>
      <div class="form-group">
        <label>Fecha de fallecimiento</label>
        <input type="date" id="personDod" disabled>
      </div>
    </div>
    <div class="form-group">
      <label>Notas (opcional)</label>
      <textarea id="personNotes" rows="2" placeholder="Información adicional..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closePersonModal()">Cancelar</button>
      <button class="btn primary" onclick="savePerson()">Guardar</button>

</div>

<!-- Relationship Modal -->
<div class="modal-overlay" id="relationModal">
  <div class="modal">
    <h2>Tipo de Relación</h2>
    <input type="hidden" id="relPerson1">
    <input type="hidden" id="relPerson2">
    <div class="form-group">
      <label>Tipo de relación</label>
      <select id="relationType">
        <option value="marriage">Matrimonio</option>
        <option value="cohabitation">Unión libre</option>
        <option value="separation">Separación</option>
        <option value="divorce">Divorcio</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeRelationModal()">Cancelar</button>
      <button class="btn primary" onclick="saveRelation()">Guardar</button>

</div>

<!-- Child Modal -->
<div class="modal-overlay" id="childModal">
  <div class="modal">
    <h2>Agregar Hijo/a</h2>
    <div class="form-group">
      <label>Padres (relación)</label>
      <select id="childParentUnion"></select>
    </div>
    <div class="form-group">
      <label>Hijo/a</label>
      <select id="childPerson"></select>
    </div>

      <label>Tipo de filiación</label>
      <select id="childType">
        <option value="biological">Biológico/a</option>

      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeChildModal()">Cancelar</button>
      <button class="btn primary" onclick="saveChild()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SVG_NS = 'http://www.w3.org/2000/svg';
const NODE_SIZE = 50;
const COLORS = {
  male: {fill:'#dbeafe',stroke:'#3b82f6'},
  female: {fill:'#fce7f3',stroke:'#ec4899'},
  other: {fill:'#fef3c7',stroke:'#f59e0b'},
  deceased: {fill:'#d1d5db',stroke:'#6b7280'},
  line: '#64748b',
  selected: '#3b82f6',
  childLine: '#64748b'
};

const state = {
  persons: [],
  unions: [],
  childLinks: [],
  nextId: 1,
  selectedId: null,
  mode: 'select',
  relationFirst: null,
  zoom: 1,
  panX: 0,
  panY: 0
};

let isPanning = false, panStart = {x:0,y:0};
let isDragging = false, dragTarget = null, dragOffset = {x:0,y:0};

function calcAge(dob, dod) {
  if (!dob) return null;
  const end = dod ? new Date(dod) : new Date();
  const birth = new Date(dob);
  let age = end.getFullYear() - birth.getFullYear();
  const m = end.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && end.getDate() < birth.getDate())) age--;
  return age;
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('es', {day:'numeric',month:'short',year:'numeric'});
}

function findPerson(id) {
  return state.persons.find(p => p.id === id);
}

function getUnionLabel(u) {
  const p1 = findPerson(u.person1Id);
  const p2 = findPerson(u.person2Id);
  if (!p1 || !p2) return '?';
  const n1 = p1.name.split(' ')[0];
  const n2 = p2.name.split(' ')[0];
  const types = {marriage:'Matrimonio',cohabitation:'Unión libre',separation:'Separación',divorce:'Divorcio'};
  return `${n1} & ${n2} (${types[u.type] || u.type})`;
}

// SVG helpers
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  return el;
}

function drawPersonNode(g, person) {
  const {x, y, gender, alive, name, dob, dod, notes} = person;
  const s = NODE_SIZE;
  const hs = s / 2;
  const colors = alive ? COLORS[gender] || COLORS.other : COLORS.deceased;
  const aliveBorder = (COLORS[gender] || COLORS.other).stroke;

  const group = svgEl('g', {
    class: 'node' + (state.selectedId === person.id ? ' selected' : ''),
    'data-id': person.id,
    transform: `translate(${x},${y})`
  });

  let shape;
  if (gender === 'male') {
    shape = svgEl('rect', {
      x: -hs, y: -hs, width: s, height: s, rx: 3,
      fill: colors.fill, stroke: alive ? aliveBorder : colors.stroke, 'stroke-width': 2.5,
      class: 'node-shape'
    });
  } else if (gender === 'female') {
    shape = svgEl('circle', {
      cx: 0, cy: 0, r: hs,
      fill: colors.fill, stroke: alive ? aliveBorder : colors.stroke, 'stroke-width': 2.5,
      class: 'node-shape'
    });
  } else {
    shape = svgEl('rect', {
      x: -hs * 0.7, y: -hs * 0.7, width: s * 0.7, height: s * 0.7, rx: 2,
      fill: colors.fill, stroke: alive ? aliveBorder : colors.stroke, 'stroke-width': 2.5,
      transform: 'rotate(45)', class: 'node-shape'
    });
  }
  group.appendChild(shape);

  if (!alive) {
    const xLine1 = svgEl('line', {x1: -hs+4, y1: -hs+4, x2: hs-4, y2: hs-4, stroke: colors.stroke, 'stroke-width': 2.5});
    const xLine2 = svgEl('line', {x1: hs-4, y1: -hs+4, x2: -hs+4, y2: hs-4, stroke: colors.stroke, 'stroke-width': 2.5});
    group.appendChild(xLine1);
    group.appendChild(xLine2);
  }

  const age = calcAge(dob, alive ? null : dod);
  const nameText = svgEl('text', {
    x: 0, y: hs + 16, 'text-anchor': 'middle',
    'font-size': '12', 'font-weight': '600', fill: '#1e293b', 'font-family': 'inherit'
  });
  nameText.textContent = name.length > 18 ? name.substring(0, 16) + '…' : name;
  group.appendChild(nameText);

  let ageLabel = '';
  if (age !== null) {
    ageLabel = alive ? `${age} años` : `† ${age} años`;
  }
  if (dob) {
    const ageText = svgEl('text', {
      x: 0, y: hs + 30, 'text-anchor': 'middle',
      'font-size': '10', fill: '#64748b', 'font-family': 'inherit'
    });
    ageText.textContent = ageLabel;
    group.appendChild(ageText);
  }

  if (notes) {
    const notesText = svgEl('text', {
      x: 0, y: hs + 42, 'text-anchor': 'middle',
      'font-size': '9', fill: '#94a3b8', 'font-style': 'italic', 'font-family': 'inherit'
    });
    notesText.textContent = notes.length > 22 ? notes.substring(0, 20) + '…' : notes;
    group.appendChild(notesText);
  }

  g.appendChild(group);
}

function drawUnionLine(g, union) {
  const p1 = findPerson(union.person1Id);
  const p2 = findPerson(union.person2Id);
  if (!p1 || !p2) return;

  const left = p1.x < p2.x ? p1 : p2;
  const right = p1.x < p2.x ? p2 : p1;
  const hs = NODE_SIZE / 2;
  const y = (left.y + right.y) / 2;
  const x1 = left.x + hs + 2;
  const x2 = right.x - hs - 2;

  let dasharray = '';
  if (union.type === 'cohabitation') dasharray = '8 4';

  const line = svgEl('line', {
    x1, y1: y, x2, y2: y,
    stroke: COLORS.line, 'stroke-width': 2,
    ...(dasharray ? {'stroke-dasharray': dasharray} : {})
  });
  g.appendChild(line);

  const mx = (x1 + x2) / 2;
  if (union.type === 'separation') {
    const sl = svgEl('line', {x1: mx - 3, y1: y - 6, x2: mx + 3, y2: y + 6, stroke: COLORS.line, 'stroke-width': 2});
    g.appendChild(sl);
  } else if (union.type === 'divorce') {
    const sl1 = svgEl('line', {x1: mx - 5, y1: y - 6, x2: mx + 1, y2: y + 6, stroke: COLORS.line, 'stroke-width': 2});
    const sl2 = svgEl('line', {x1: mx - 1, y1: y - 6, x2: mx + 5, y2: y + 6, stroke: COLORS.line, 'stroke-width': 2});
    g.appendChild(sl1);
    g.appendChild(sl2);
  }
}

function drawChildLinks(g) {
  const unionChildren = {};
  for (const cl of state.childLinks) {
    if (!unionChildren[cl.unionId]) unionChildren[cl.unionId] = [];
    unionChildren[cl.unionId].push(cl);
  }

  for (const [uid, children] of Object.entries(unionChildren)) {
    const union = state.unions.find(u => u.id === parseInt(uid));
    if (!union) continue;
    const p1 = findPerson(union.person1Id);
    const p2 = findPerson(union.person2Id);
    if (!p1 || !p2) continue;

    const mx = (p1.x + p2.x) / 2;
    const my = (p1.y + p2.y) / 2;
    const hs = NODE_SIZE / 2;

    const childPersons = children.map(c => ({...c, person: findPerson(c.childId)})).filter(c => c.person);
    if (childPersons.length === 0) continue;

    const barY = my + 50;

    const vLine = svgEl('line', {x1: mx, y1: my, x2: mx, y2: barY, stroke: COLORS.childLine, 'stroke-width': 1.5});
    g.appendChild(vLine);

    if (childPersons.length > 1) {
      const xs = childPersons.map(c => c.person.x).sort((a,b) => a - b);
      const barLine = svgEl('line', {x1: xs[0], y1: barY, x2: xs[xs.length-1], y2: barY, stroke: COLORS.childLine, 'stroke-width': 1.5});
      g.appendChild(barLine);
    }

    for (const cl of childPersons) {
      const cx = cl.person.x;
      const cy = cl.person.y - hs - 2;
      let dasharray = '';
      if (cl.type === 'adopted') dasharray = '6 3';
      else if (cl.type === 'foster') dasharray = '2 3';

      const topX = childPersons.length === 1 ? mx : cx;
      const vl = svgEl('line', {
        x1: topX, y1: barY, x2: cx, y2: cy,
        stroke: COLORS.childLine, 'stroke-width': 1.5,
        ...(dasharray ? {'stroke-dasharray': dasharray} : {})
      });
      g.appendChild(vl);
    }
  }
}

function render() {
  const diagram = document.getElementById('diagram');
  diagram.innerHTML = '';
  diagram.setAttribute('transform', `translate(${state.panX},${state.panY}) scale(${state.zoom})`);

  for (const u of state.unions) drawUnionLine(diagram, u);
  drawChildLinks(diagram);
  for (const p of state.persons) drawPersonNode(diagram, p);

  renderPersonList();
  renderRelationList();
}

function renderPersonList() {
  const list = document.getElementById('personList');
  list.innerHTML = '';
  for (const p of state.persons) {
    const age = calcAge(p.dob, p.alive ? null : p.dod);
    const li = document.createElement('li');
    li.className = 'person-item' + (state.selectedId === p.id ? ' selected' : '');
    li.innerHTML = `
      <div class="symbol ${p.gender} ${!p.alive ? 'deceased' : ''}"></div>
      <div class="info">
        <div class="name">${esc(p.name)}</div>
        <div class="age">${age !== null ? (p.alive ? age + ' años' : '† ' + age + ' años') : ''}</div>
      </div>
      <div class="actions">
        <button onclick="editPerson(${p.id})" title="Editar"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
        <button onclick="deletePerson(${p.id})" title="Eliminar"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
      </div>
    `;
    li.addEventListener('click', (e) => {
      if (e.target.closest('.actions')) return;
      selectPerson(p.id);
    });
    list.appendChild(li);
  }
}

function renderRelationList() {
  const div = document.getElementById('relationList');
  if (state.unions.length === 0) {
    div.innerHTML = '<p style="font-size:12px;color:var(--text-secondary)">No hay relaciones. Usa el botón "Relación" para conectar dos personas.</p>';
    return;
  }
  let html = '<ul style="list-style:none;font-size:12px">';
  for (const u of state.unions) {
    const children = state.childLinks.filter(c => c.unionId === u.id);
    html += `<li style="padding:4px 0;display:flex;align-items:center;justify-content:space-between">
      <span>${esc(getUnionLabel(u))}${children.length ? ` — ${children.length} hijo(s)` : ''}</span>
      <button onclick="deleteUnion(${u.id})" style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:14px" title="Eliminar relación">×</button>
    </li>`;
  }
  html += '</ul>';
  div.innerHTML = html;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Person CRUD
function openPersonModal(id) {
  const modal = document.getElementById('personModal');
  const title = document.getElementById('personModalTitle');
  if (id) {
    const p = findPerson(id);
    if (!p) return;
    title.textContent = 'Editar Persona';
    document.getElementById('editPersonId').value = id;
    document.getElementById('personName').value = p.name;
    document.getElementById('personDob').value = p.dob || '';
    document.getElementById('personGender').value = p.gender;
    document.getElementById('personAlive').value = String(p.alive);
    document.getElementById('personDod').value = p.dod || '';
    document.getElementById('personDod').disabled = p.alive;
    document.getElementById('personNotes').value = p.notes || '';
  } else {
    title.textContent = 'Agregar Persona';
    document.getElementById('editPersonId').value = '';
    document.getElementById('personName').value = '';
    document.getElementById('personDob').value = '';
    document.getElementById('personGender').value = 'male';
    document.getElementById('personAlive').value = 'true';
    document.getElementById('personDod').value = '';
    document.getElementById('personDod').disabled = true;
    document.getElementById('personNotes').value = '';
  }
  modal.classList.add('active');
  setTimeout(() => document.getElementById('personName').focus(), 100);
}

function closePersonModal() {
  document.getElementById('personModal').classList.remove('active');
}

function savePerson() {
  const name = document.getElementById('personName').value.trim();
  if (!name) { showToast('El nombre es obligatorio'); return; }
  const dob = document.getElementById('personDob').value;
  const gender = document.getElementById('personGender').value;
  const alive = document.getElementById('personAlive').value === 'true';
  const dod = alive ? '' : document.getElementById('personDod').value;
  const notes = document.getElementById('personNotes').value.trim();
  const editId = document.getElementById('editPersonId').value;

  if (editId) {
    const p = findPerson(parseInt(editId));
    if (p) {
      p.name = name; p.dob = dob; p.gender = gender;
      p.alive = alive; p.dod = dod; p.notes = notes;
    }
  } else {
    const canvasRect = document.getElementById('canvasWrap').getBoundingClientRect();
    const cx = (canvasRect.width / 2 - state.panX) / state.zoom;
    const cy = (canvasRect.height / 2 - state.panY) / state.zoom;
    const offset = state.persons.length * 30;
    state.persons.push({
      id: state.nextId++,
      name, dob, gender, alive, dod, notes,
      x: cx + (Math.random() - 0.5) * 100 + offset,
      y: cy + (Math.random() - 0.5) * 80
    });
  }
  closePersonModal();
  render();
  showToast(editId ? 'Persona actualizada' : 'Persona agregada');
}

function editPerson(id) {
  openPersonModal(id);
}

function deletePerson(id) {
  if (!confirm('¿Eliminar esta persona y sus conexiones?')) return;
  state.persons = state.persons.filter(p => p.id !== id);
  state.childLinks = state.childLinks.filter(c => c.childId !== id);
  const affectedUnions = state.unions.filter(u => u.person1Id === id || u.person2Id === id).map(u => u.id);
  state.childLinks = state.childLinks.filter(c => !affectedUnions.includes(c.unionId));
  state.unions = state.unions.filter(u => u.person1Id !== id && u.person2Id !== id);
  if (state.selectedId === id) state.selectedId = null;
  render();
  showToast('Persona eliminada');
}

function selectPerson(id) {
  if (state.mode === 'relation') {
    handleRelationClick(id);
    return;
  }
  state.selectedId = state.selectedId === id ? null : id;
  render();
}

// Relation mode
function startRelationMode() {
  if (state.persons.length < 2) { showToast('Se necesitan al menos 2 personas'); return; }
  state.mode = 'relation';
  state.relationFirst = null;
  document.getElementById('modeIndicator').style.display = 'block';
  document.getElementById('modeText').textContent = 'Selecciona la primera persona';
  document.getElementById('btnAddRelation').classList.add('active');
}

function handleRelationClick(id) {
  if (!state.relationFirst) {
    state.relationFirst = id;
    state.selectedId = id;
    document.getElementById('modeText').textContent = 'Ahora selecciona la segunda persona';
    render();
  } else {
    if (id === state.relationFirst) { showToast('Selecciona una persona diferente'); return; }
    const exists = state.unions.some(u =>
      (u.person1Id === state.relationFirst && u.person2Id === id) ||
      (u.person1Id === id && u.person2Id === state.relationFirst)
    );
    if (exists) { showToast('Ya existe una relación entre estas personas'); cancelMode(); return; }
    document.getElementById('relPerson1').value = state.relationFirst;
    document.getElementById('relPerson2').value = id;
    document.getElementById('relationModal').classList.add('active');
    cancelMode();
  }
}

function closeRelationModal() {
  document.getElementById('relationModal').classList.remove('active');
}

function saveRelation() {
  const p1 = parseInt(document.getElementById('relPerson1').value);
  const p2 = parseInt(document.getElementById('relPerson2').value);
  const type = document.getElementById('relationType').value;
  state.unions.push({id: state.nextId++, person1Id: p1, person2Id: p2, type});
  closeRelationModal();
  render();
  showToast('Relación creada');
}

function deleteUnion(id) {
  if (!confirm('¿Eliminar esta relación y sus conexiones de hijos?')) return;
  state.unions = state.unions.filter(u => u.id !== id);
  state.childLinks = state.childLinks.filter(c => c.unionId !== id);
  render();
  showToast('Relación eliminada');
}

// Child mode
function startChildMode() {
  if (state.unions.length === 0) { showToast('Primero crea una relación entre dos personas'); return; }
  const available = state.persons.filter(p => {
    const isInUnion = state.unions.some(u => u.person1Id === p.id || u.person2Id === p.id);
    return true;
  });
  if (state.persons.length < 3 && state.unions.length > 0) {
    showToast('Agrega al menos un hijo/a primero');
    return;
  }

  const unionSel = document.getElementById('childParentUnion');
  unionSel.innerHTML = '';
  for (const u of state.unions) {
    const opt = document.createElement('option');
    opt.value = u.id;
    opt.textContent = getUnionLabel(u);
    unionSel.appendChild(opt);
  }

  const childSel = document.getElementById('childPerson');
  childSel.innerHTML = '';
  for (const p of state.persons) {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    childSel.appendChild(opt);
  }

  document.getElementById('childModal').classList.add('active');
}

function closeChildModal() {
  document.getElementById('childModal').classList.remove('active');
}

function saveChild() {
  const unionId = parseInt(document.getElementById('childParentUnion').value);
  const childId = parseInt(document.getElementById('childPerson').value);
  const type = document.getElementById('childType').value;

  const union = state.unions.find(u => u.id === unionId);
  if (union && (union.person1Id === childId || union.person2Id === childId)) {
    showToast('No se puede asignar un padre como su propio hijo'); return;
  }
  const exists = state.childLinks.some(c => c.unionId === unionId && c.childId === childId);
  if (exists) { showToast('Esta conexión ya existe'); return; }

  state.childLinks.push({unionId, childId, type});
  closeChildModal();
  render();
  showToast('Hijo/a vinculado');
}

function cancelMode() {
  state.mode = 'select';
  state.relationFirst = null;
  document.getElementById('modeIndicator').style.display = 'none';
  document.getElementById('btnAddRelation').classList.remove('active');
  render();
}

// Alive/Dead toggle
document.getElementById('personAlive').addEventListener('change', function() {
  document.getElementById('personDod').disabled = this.value === 'true';
  if (this.value === 'true') document.getElementById('personDod').value = '';
});

// Drag & Drop
const canvas = document.getElementById('canvas');

canvas.addEventListener('mousedown', (e) => {
  const node = e.target.closest('.node');
  if (node) {
    const id = parseInt(node.getAttribute('data-id'));
    const person = findPerson(id);
    if (!person) return;
    isDragging = true;
    dragTarget = person;
    const pt = screenToSvg(e.clientX, e.clientY);
    dragOffset.x = pt.x - person.x;
    dragOffset.y = pt.y - person.y;
    canvas.classList.add('grabbing');
    selectPerson(id);
    e.preventDefault();
    return;
  }
  isPanning = true;
  panStart.x = e.clientX - state.panX;
  panStart.y = e.clientY - state.panY;
  canvas.classList.add('grabbing');
});

canvas.addEventListener('mousemove', (e) => {
  if (isDragging && dragTarget) {
    const pt = screenToSvg(e.clientX, e.clientY);
    dragTarget.x = pt.x - dragOffset.x;
    dragTarget.y = pt.y - dragOffset.y;
    render();
  } else if (isPanning) {
    state.panX = e.clientX - panStart.x;
    state.panY = e.clientY - panStart.y;
    render();
  }
});

canvas.addEventListener('mouseup', () => {
  isDragging = false;
  dragTarget = null;
  isPanning = false;
  canvas.classList.remove('grabbing');
});

canvas.addEventListener('mouseleave', () => {
  isDragging = false;
  dragTarget = null;
  isPanning = false;
  canvas.classList.remove('grabbing');
});

canvas.addEventListener('dblclick', (e) => {
  const node = e.target.closest('.node');
  if (node) {
    const id = parseInt(node.getAttribute('data-id'));
    openPersonModal(id);
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  const newZoom = Math.max(0.2, Math.min(3, state.zoom + delta));
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  state.panX = mx - (mx - state.panX) * (newZoom / state.zoom);
  state.panY = my - (my - state.panY) * (newZoom / state.zoom);
  state.zoom = newZoom;
  render();
}, {passive: false});

// Touch support
let touchStart = null, touchDist = null;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    const node = e.target.closest('.node');
    if (node) {
      const id = parseInt(node.getAttribute('data-id'));
      const person = findPerson(id);
      if (!person) return;
      isDragging = true;
      dragTarget = person;
      const pt = screenToSvg(e.touches[0].clientX, e.touches[0].clientY);
      dragOffset.x = pt.x - person.x;
      dragOffset.y = pt.y - person.y;
      selectPerson(id);
    } else {
      isPanning = true;
      panStart.x = e.touches[0].clientX - state.panX;
      panStart.y = e.touches[0].clientY - state.panY;
    }
  } else if (e.touches.length === 2) {
    touchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
  e.preventDefault();
}, {passive: false});

canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1) {
    if (isDragging && dragTarget) {
      const pt = screenToSvg(e.touches[0].clientX, e.touches[0].clientY);
      dragTarget.x = pt.x - dragOffset.x;
      dragTarget.y = pt.y - dragOffset.y;
      render();
    } else if (isPanning) {
      state.panX = e.touches[0].clientX - panStart.x;
      state.panY = e.touches[0].clientY - panStart.y;
      render();
    }
  } else if (e.touches.length === 2 && touchDist) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const scale = d / touchDist;
    state.zoom = Math.max(0.2, Math.min(3, state.zoom * scale));
    touchDist = d;
    render();
  }
  e.preventDefault();
}, {passive: false});

canvas.addEventListener('touchend', () => {
  isDragging = false;
  dragTarget = null;
  isPanning = false;
  touchDist = null;
});

function screenToSvg(sx, sy) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (sx - rect.left - state.panX) / state.zoom,
    y: (sy - rect.top - state.panY) / state.zoom
  };
}

// Zoom
function zoomIn() { state.zoom = Math.min(3, state.zoom + 0.2); render(); }
function zoomOut() { state.zoom = Math.max(0.2, state.zoom - 0.2); render(); }
function resetView() { state.zoom = 1; state.panX = 0; state.panY = 0; render(); }

// Sidebar
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// Auto-layout
function autoLayout() {
  if (state.persons.length === 0) return;

  const generations = assignGenerations();
  const genGroups = {};
  for (const [pid, gen] of Object.entries(generations)) {
    if (!genGroups[gen]) genGroups[gen] = [];
    genGroups[gen].push(parseInt(pid));
  }

  const sortedGens = Object.keys(genGroups).map(Number).sort((a,b) => a - b);
  const canvasRect = document.getElementById('canvasWrap').getBoundingClientRect();
  const startY = 100;
  const gapY = 140;
  const gapX = 160;

  for (let gi = 0; gi < sortedGens.length; gi++) {
    const gen = sortedGens[gi];
    const members = genGroups[gen];
    const totalWidth = (members.length - 1) * gapX;
    const startX = (canvasRect.width / 2 - state.panX) / state.zoom - totalWidth / 2;

    for (let i = 0; i < members.length; i++) {
      const p = findPerson(members[i]);
      if (p) {
        p.x = startX + i * gapX;
        p.y = startY + gi * gapY;
      }
    }
  }

  render();
  showToast('Diagrama organizado');
}

function assignGenerations() {
  const gens = {};
  const parentOf = {};

  for (const cl of state.childLinks) {
    const union = state.unions.find(u => u.id === cl.unionId);
    if (union) {
      if (!parentOf[cl.childId]) parentOf[cl.childId] = [];
      parentOf[cl.childId].push(union.person1Id, union.person2Id);
    }
  }

  function getGen(pid, visited) {
    if (gens[pid] !== undefined) return gens[pid];
    if (visited.has(pid)) return 0;
    visited.add(pid);
    const parents = parentOf[pid];
    if (!parents || parents.length === 0) {
      gens[pid] = 0;
      return 0;
    }
    let maxParentGen = -1;
    for (const par of parents) {
      maxParentGen = Math.max(maxParentGen, getGen(par, visited));
    }
    gens[pid] = maxParentGen + 1;
    return gens[pid];
  }

  for (const p of state.persons) {
    getGen(p.id, new Set());
  }

  for (const u of state.unions) {
    const g1 = gens[u.person1Id] || 0;
    const g2 = gens[u.person2Id] || 0;
    const mg = Math.min(g1, g2);
    gens[u.person1Id] = mg;
    gens[u.person2Id] = mg;
  }

  return gens;
}

// Save/Load
function saveToLocal() {
  const data = {persons: state.persons, unions: state.unions, childLinks: state.childLinks, nextId: state.nextId};
  localStorage.setItem('genograma_data', JSON.stringify(data));
  showToast('Genograma guardado');
}

function loadFromLocal() {
  const raw = localStorage.getItem('genograma_data');
  if (!raw) { showToast('No hay datos guardados'); return; }
  try {
    const data = JSON.parse(raw);
    state.persons = data.persons || [];
    state.unions = data.unions || [];
    state.childLinks = data.childLinks || [];
    state.nextId = data.nextId || 1;
    state.selectedId = null;
    render();
    showToast('Genograma cargado');
  } catch { showToast('Error al cargar datos'); }
}

// Export PNG
function exportPNG() {
  const svgEl = document.getElementById('canvas');
  const diagram = document.getElementById('diagram');

  const origTransform = diagram.getAttribute('transform');
  diagram.setAttribute('transform', 'translate(0,0) scale(1)');

  const bbox = diagram.getBBox();
  const pad = 60;
  const w = bbox.width + pad * 2;
  const h = bbox.height + pad * 2;

  const cloned = svgEl.cloneNode(true);
  cloned.setAttribute('width', w);
  cloned.setAttribute('height', h);
  cloned.setAttribute('viewBox', `${bbox.x - pad} ${bbox.y - pad} ${w} ${h}`);
  const gridBg = cloned.querySelector('.grid-bg');
  if (gridBg) gridBg.setAttribute('fill', '#ffffff');

  const clonedDiagram = cloned.querySelector('#diagram');
  if (clonedDiagram) clonedDiagram.setAttribute('transform', 'translate(0,0) scale(1)');

  diagram.setAttribute('transform', origTransform);

  const serializer = new XMLSerializer();
  let svgStr = serializer.serializeToString(cloned);
  svgStr = svgStr.replace(/font-family="inherit"/g, 'font-family="Segoe UI, system-ui, sans-serif"');

  const img = new Image();
  const blob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);

  img.onload = () => {
    const scale = 2;
    const c = document.createElement('canvas');
    c.width = w * scale;
    c.height = h * scale;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);

    const a = document.createElement('a');
    a.download = 'genograma.png';
    a.href = c.toDataURL('image/png');
    a.click();
    showToast('PNG exportado');
  };
  img.src = url;
}

// Export SVG

  const origTransform = diagram.getAttribute('transform');
  diagram.setAttribute('transform', 'translate(0,0) scale(1)');

  const pad = 60;
  const w = bbox.width + pad * 2;
  const h = bbox.height + pad * 2;

  const cloned = svgEl.cloneNode(true);
  cloned.setAttribute('width', w);
  cloned.setAttribute('height', h);
  cloned.setAttribute('viewBox', `${bbox.x - pad} ${bbox.y - pad} ${w} ${h}`);
  const gridBg = cloned.querySelector('.grid-bg');
  if (gridBg) gridBg.setAttribute('fill', '#ffffff');

  const clonedDiagram = cloned.querySelector('#diagram');
  if (clonedDiagram) clonedDiagram.setAttribute('transform', 'translate(0,0) scale(1)');

// Print
function printDiagram() {
  const diagram = document.getElementById('diagram');
  const origTransform = diagram.getAttribute('transform');

  const bbox = diagram.getBBox();
  const pad = 40;
  const svgEl = document.getElementById('canvas');
  svgEl.setAttribute('viewBox', `${bbox.x - pad} ${bbox.y - pad} ${bbox.width + pad*2} ${bbox.height + pad*2}`);
  diagram.setAttribute('transform', 'translate(0,0) scale(1)');

  window.print();

  svgEl.removeAttribute('viewBox');
  diagram.setAttribute('transform', origTransform);
}

// Clear all
function clearAll() {
  if (!confirm('¿Estás seguro de que deseas borrar todo el genograma?')) return;
  state.persons = [];
  state.unions = [];
  state.childLinks = [];
  state.selectedId = null;
  state.nextId = 1;
  render();
  showToast('Genograma limpiado');
}

// Toast
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.mode !== 'select') cancelMode();
    closePersonModal();
    closeRelationModal();
    closeChildModal();
  }
  if (e.key === 'Delete' && state.selectedId && !document.querySelector('.modal-overlay.active')) {
    deletePerson(state.selectedId);
  }
});

// Init
render();

const saved = localStorage.getItem('genograma_data');
if (saved) {
  try {
    const data = JSON.parse(saved);
    if (data.persons && data.persons.length > 0) {
      state.persons = data.persons;
      state.unions = data.unions || [];
      state.childLinks = data.childLinks || [];
      state.nextId = data.nextId || 1;
      render();
    }
  } catch {}
}
